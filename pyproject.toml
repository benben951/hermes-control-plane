[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-control-plane"
version = "0.1.0"
description = "WSL2-first control plane for orchestrating Codex and Claude Code."
requires-python = ">=3.11"
authors = [
  { name = "jie13" }
]
dependencies = []

[project.scripts]
hermes = "hermes_control_plane.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
